name: Docker Build Validation

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]

jobs:
  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Config
        run: docker compose config
